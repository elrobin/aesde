<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>

  <!-- Entorno -->
  <rect x="10" y="10" width="980" height="615" rx="14" fill="#f7f7f7" stroke="#999" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="30" y="38" font-size="16" font-weight="bold" fill="#777" letter-spacing="2">ENTORNO</text>
  <text x="970" y="38" font-size="15" fill="#777" text-anchor="end">usuarios · proveedores · reguladores</text>

  <!-- Sistema -->
  <rect x="40" y="55" width="920" height="550" rx="12" fill="#f2f7fc" stroke="#1f4e79" stroke-width="3"/>
  <text x="60" y="87" font-size="19" font-weight="bold" fill="#1f4e79">SISTEMA · organización matriz</text>
  <g font-size="16" text-anchor="middle" fill="#000">
    <rect x="160" y="105" width="200" height="48" rx="6" fill="#cfe2f3" stroke="#1f4e79" stroke-width="1.5"/>
    <text x="260" y="135">Estándares comunes</text>
    <rect x="400" y="105" width="200" height="48" rx="6" fill="#cfe2f3" stroke="#1f4e79" stroke-width="1.5"/>
    <text x="500" y="135">Plataforma tecnológica</text>
    <rect x="640" y="105" width="200" height="48" rx="6" fill="#cfe2f3" stroke="#1f4e79" stroke-width="1.5"/>
    <text x="740" y="135">Marca e imagen</text>
  </g>

  <!-- Nivel intermedio -->
  <rect x="90" y="180" width="820" height="400" rx="12" fill="#f8f3fc" stroke="#674ea7" stroke-width="3"/>
  <text x="110" y="212" font-size="19" font-weight="bold" fill="#674ea7">SUBSISTEMA · nivel intermedio</text>
  <g font-size="16" text-anchor="middle" fill="#000">
    <rect x="290" y="230" width="190" height="48" rx="6" fill="#e6d7f2" stroke="#674ea7" stroke-width="1.5"/>
    <text x="385" y="260">Adaptación de la oferta</text>
    <rect x="645" y="230" width="190" height="48" rx="6" fill="#e6d7f2" stroke="#674ea7" stroke-width="1.5"/>
    <text x="740" y="260">Cumplimiento normativo</text>
  </g>

  <!-- Unidad local -->
  <rect x="140" y="305" width="720" height="250" rx="12" fill="#f1f8ee" stroke="#38761d" stroke-width="3"/>
  <text x="160" y="337" font-size="19" font-weight="bold" fill="#38761d">SUBSISTEMA · unidad local</text>
  <g font-size="16" text-anchor="middle" fill="#000">
    <rect x="295" y="360" width="170" height="48" rx="6" fill="#d9ead3" stroke="#38761d" stroke-width="1.5"/>
    <text x="380" y="390">Horario</text>
    <rect x="525" y="360" width="170" height="48" rx="6" fill="#d9ead3" stroke="#38761d" stroke-width="1.5"/>
    <text x="610" y="390">Gestión del personal</text>
    <rect x="175" y="470" width="170" height="48" rx="6" fill="#fff2cc" stroke="#bf9000" stroke-width="1.5"/>
    <text x="260" y="500">Servicio principal</text>
    <rect x="415" y="470" width="170" height="48" rx="6" fill="#fff2cc" stroke="#bf9000" stroke-width="1.5"/>
    <text x="500" y="500">Servicio digital</text>
    <rect x="655" y="470" width="170" height="48" rx="6" fill="#fff2cc" stroke="#bf9000" stroke-width="1.5"/>
    <text x="740" y="500">Quejas</text>
  </g>

  <!-- Dependencias que cruzan niveles -->
  <g stroke="#555" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#flecha)">
    <line x1="260" y1="153" x2="260" y2="466"/>
    <line x1="500" y1="153" x2="500" y2="466"/>
    <line x1="740" y1="278" x2="740" y2="466"/>
  </g>

  <!-- Títulos por encima de las flechas -->
  <rect x="104" y="192" width="300" height="28" fill="#f8f3fc"/>
  <text x="110" y="212" font-size="19" font-weight="bold" fill="#674ea7">SUBSISTEMA · nivel intermedio</text>
  <rect x="154" y="317" width="262" height="28" fill="#f1f8ee"/>
  <text x="160" y="337" font-size="19" font-weight="bold" fill="#38761d">SUBSISTEMA · unidad local</text>

  <!-- Leyenda -->
  <g font-size="15" fill="#333">
    <rect x="40" y="655" width="22" height="22" rx="4" fill="#cfe2f3" stroke="#1f4e79"/>
    <text x="70" y="672">Depende del sistema</text>
    <rect x="245" y="655" width="22" height="22" rx="4" fill="#e6d7f2" stroke="#674ea7"/>
    <text x="275" y="672">Del nivel intermedio</text>
    <rect x="445" y="655" width="22" height="22" rx="4" fill="#d9ead3" stroke="#38761d"/>
    <text x="475" y="672">De la unidad local</text>
    <rect x="630" y="655" width="22" height="22" rx="4" fill="#fff2cc" stroke="#bf9000"/>
    <text x="660" y="672">Cruza niveles</text>
    <line x1="790" y1="666" x2="835" y2="666" stroke="#555" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#flecha)"/>
    <text x="845" y="672">lo define arriba</text>
  </g>
</svg>
